name: Sync & Build

on:
  schedule:
    # Daily at 06:00 Beijing time (22:00 UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: KinkOwO/115US-launcher
  PUBLISH_REPO: RicardoLz/115-launcher

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream & check if build needed
        id: sync
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream
          $localSha = git rev-parse HEAD
          $upstreamSha = git rev-parse upstream/main
          Write-Output "Fork HEAD: $localSha"
          Write-Output "Upstream HEAD: $upstreamSha"

          if ($localSha -ne $upstreamSha) {
            Write-Output "New upstream commits, syncing..."
            git merge upstream/main --no-edit
            git push origin main
            $localSha = git rev-parse HEAD
          }

          # Check if this commit was already built
          $needBuild = $true
          try {
            $lastRelease = gh release list --repo ${{ env.PUBLISH_REPO }} --limit 1 --json tagName -q '.[0].tagName' 2>$null
            $global:LASTEXITCODE = 0
            if ($lastRelease) {
              $lastBody = gh release view $lastRelease --repo ${{ env.PUBLISH_REPO }} --json body -q '.body' 2>$null
              $global:LASTEXITCODE = 0
              if ($lastBody -and $lastBody -match 'Source commit:\s*([0-9a-f]{40})') {
                if ($localSha -eq $Matches[1]) { $needBuild = $false }
              }
            }
          } catch {
            Write-Output "Release check skipped: $_"
          }
          Write-Output "Need build: $needBuild"
          $short = $localSha.Substring(0,7)
          $date = Get-Date -Format "yyyyMMdd-HHmm"
          $tag = "v$date-$short"
          Add-Content $env:GITHUB_OUTPUT "head_sha=$localSha"
          Add-Content $env:GITHUB_OUTPUT "need_build=$needBuild"
          Add-Content $env:GITHUB_OUTPUT "tag=$tag"

      - name: Setup Node
        if: steps.sync.outputs.need_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        if: steps.sync.outputs.need_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.sync.outputs.need_build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        if: steps.sync.outputs.need_build == 'true'
        run: npm install

      - name: Set version to tag
        if: steps.sync.outputs.need_build == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.sync.outputs.tag }}".TrimStart('v')
          $cargo = "src-tauri/Cargo.toml"
          (Get-Content $cargo) -replace '^version = ".*"', "version = `"$tag`"" | Set-Content $cargo
          Get-Content $cargo | Select-Object -First 5

      - name: Build Tauri (exe only)
        if: steps.sync.outputs.need_build == 'true'
        shell: pwsh
        run: npx tauri build --no-bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.sync.outputs.need_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.sync.outputs.tag }}"
          $exe = "src-tauri/target/release/dfo-launcher.exe"
          if (-not (Test-Path $exe)) { Write-Error "Build failed: exe not found" }
          $headSha = "${{ steps.sync.outputs.head_sha }}"
          $body = "Auto build from ${{ env.UPSTREAM_REPO }}@$($headSha.Substring(0,7))`nSource commit: $headSha"
          gh release create $tag $exe --repo ${{ env.PUBLISH_REPO }} --title "Build $tag" --notes $body
